name: Refine placeholder verifier (one-off)

on:
  push:
    branches:
      - feat/visual-identity-03-production-candidate-01
    paths:
      - '.github/workflows/refine-placeholder-verifier.yml'

permissions:
  contents: write

jobs:
  refine-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/visual-identity-03-production-candidate-01

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refine false-positive placeholder scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify.mjs')
          source = path.read_text()
          old = '  /placeholder text/i,'
          new = r'  />\s*placeholder text\s*</i,'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one verifier pattern, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- scripts/verify.mjs

      - name: Install dependencies from committed lock
        run: npm ci

      - name: Run full production quality check
        run: npm run check

      - name: Commit qualified verifier correction and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify.mjs
          git rm .github/workflows/refine-placeholder-verifier.yml
          git commit -m 'verify: distinguish placeholder stubs from editorial prose'
          git push origin HEAD:feat/visual-identity-03-production-candidate-01
