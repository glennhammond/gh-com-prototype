name: Adjust browser QA POP test (one-off)

on:
  push:
    branches:
      - feat/visual-identity-03-production-candidate-01
    paths:
      - '.github/workflows/adjust-browser-qa-test.yml'

permissions:
  contents: write

jobs:
  adjust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/visual-identity-03-production-candidate-01

      - name: Make POP test measure available scroll range
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/browser-qa-temp.yml')
          source = path.read_text()
          old = """            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await context.newPage();
            await page.goto(base + '/work/wellbeing-studio/contextual-entry', { waitUntil: 'networkidle' });
            await page.evaluate(() => window.scrollTo(0, Math.min(950, document.documentElement.scrollHeight - innerHeight - 20)));
            await page.waitForTimeout(150);
            const before = await page.evaluate(() => window.scrollY);
            assert(before > 200, `Test page did not scroll far enough (${before}px)`);
            await page.locator('#artefact-daily-wellbeing-journey').click();
            await page.waitForURL('**/daily-wellbeing-journey');
            await page.goBack({ waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(500);
            const after = await page.evaluate(() => window.scrollY);
            assert(Math.abs(after - before) <= 140, `POP scroll restore drifted from ${before}px to ${after}px`);
"""
          new = """            const context = await browser.newContext({ viewport: { width: 1440, height: 600 } });
            const page = await context.newPage();
            await page.goto(base + '/work/wellbeing-studio/contextual-entry', { waitUntil: 'networkidle' });
            const range = await page.evaluate(() => Math.max(0, document.documentElement.scrollHeight - innerHeight));
            assert(range > 80, `Record does not expose enough scroll range to test restoration (${range}px)`);
            const target = Math.round(range * 0.7);
            await page.evaluate((y) => window.scrollTo(0, y), target);
            await page.waitForTimeout(150);
            const before = await page.evaluate(() => window.scrollY);
            assert(before > 40, `Record did not reach a meaningful scroll position (${before}px)`);
            await page.locator('#artefact-daily-wellbeing-journey').click();
            await page.waitForURL('**/daily-wellbeing-journey');
            await page.goBack({ waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(500);
            const after = await page.evaluate(() => window.scrollY);
            const tolerance = Math.max(60, Math.round(range * 0.15));
            assert(Math.abs(after - before) <= tolerance, `POP scroll restore drifted from ${before}px to ${after}px (tolerance ${tolerance}px)`);
"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one POP test block, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- .github/workflows/browser-qa-temp.yml

      - name: Commit corrected test and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/browser-qa-temp.yml
          git rm .github/workflows/adjust-browser-qa-test.yml
          git commit -m 'qa: measure POP restoration against available scroll range'
          git push origin HEAD:feat/visual-identity-03-production-candidate-01
