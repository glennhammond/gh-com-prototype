name: Refresh visual identity lockfile (one-off)

on:
  push:
    branches:
      - feat/visual-identity-03-production-candidate-01
    paths:
      - '.github/workflows/refresh-visual-identity-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/visual-identity-03-production-candidate-01

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate npm lockfile with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Confirm Source Serif is locked
        run: grep -q 'node_modules/@fontsource/source-serif-4' package-lock.json

      - name: Commit generated lock and remove this one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/refresh-visual-identity-lock.yml
          git commit -m 'build: regenerate lockfile for Source Serif 4'
          git push origin HEAD:feat/visual-identity-03-production-candidate-01
